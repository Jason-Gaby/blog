<div class="dash-app-container" style="margin: 20px 0;">
    <iframe
        src="{{ url_prefix }}/{{ self.url_suffix }}"
        title="{{ self.title }}"
        width="100%"
        height="{{ self.height }}px"
        style="border: 2px solid #eee; border-radius: 8px;"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin"
    ></iframe>
</div>
